name: release

# spec: mavergreen-conventions SKILL.md "Release workflow" -- auto-cut on main: a push to main whose UPSTREAM_VERSION has no
#       release yet cuts <upstream>-mavericks.1; a dispatch with local_release=true cuts .N+1 (repackage-on-ingredient-bump.yml);
#       reconcile=true (reconcile.yml) publishes only while no release carries this declared state. PRs and other branches build
#       and gate, never publish.
# spec: .github/workflows/pins-bot.yml -- the pins bot pushes to Renovate's branch with a GitHub App token, which starts the
#       pull_request run below (that run's required check is the PR's); renovate/** is left out of the push trigger so that
#       push does not build the same head twice.
on:
  push:
    branches-ignore: ['renovate/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      local_release:
        description: "Cut a -mavericks.(N+1) repackage of the current upstream"
        type: boolean
        default: false
      reconcile:
        description: "Set by the nightly reconcile backstop: publish only if no release carries this declared state"
        type: boolean
        default: false

permissions:
  contents: read

# spec: mavergreen-conventions SKILL.md "Release workflow" -- a run that can publish is alone in its group
concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    outputs:
      version: ${{ steps.ver.outputs.full }}
      publish: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }

      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      - name: Build out of tree; the tests read upstream's release from where the build puts it
        run: |
          set -eu
          b="$RUNNER_TEMP/mm-build"
          up="$(tr -d '[:space:]' < UPSTREAM_VERSION)"
          {
            echo "MAVERICKS_BUILD_ROOT=$b"
            echo "MACFUSE_DMG_ROOT=$b/up/dmg-root"
            echo "MACFUSE_DEBUG_TBZ=$b/up/macfuse-$up-debug.tbz"
            echo "DIST=$b/dist"
          } >> "$GITHUB_ENV"

      - name: Version + publish decision
        id: ver
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LOCAL_RELEASE: ${{ inputs.local_release }}
          RECONCILE: ${{ inputs.reconcile }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          effective_local_release="$LOCAL_RELEASE"
          if [ "$RECONCILE" = true ]; then effective_local_release=true; fi
          mode="$(LOCAL_RELEASE="$effective_local_release" sh "$SHIPYARD_SCRIPTS/release-mode.sh")"
          out="$(sh build/version.sh "$mode")"
          full="$(printf '%s\n' "$out" | sed -n 's/^FULL=//p')"
          rel="$(printf '%s\n' "$out" | sed -n 's/^RELEASE=//p')"
          [ -n "$full" ] || { echo "::error::version.sh gave no FULL= line: $out"; exit 1; }
          # spec: mavergreen-conventions SKILL.md "Release workflow" -- only a push to main or an explicit dispatch publishes
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            push:refs/heads/main|workflow_dispatch:*) : ;;
            *) rel=no ;;
          esac
          # spec: mavergreen-conventions SKILL.md "A release is a declared state" -- a reconcile dispatch publishes only while no
          #       release carries this state
          if [ "$rel" = yes ] && [ "$RECONCILE" = true ]; then
            digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
            answer="$(sh "$SHIPYARD_SCRIPTS/release-needed.sh" --digest "$digest" --version "$full")"
            echo "release-needed: $answer"
            [ "$answer" = PUBLISH ] || rel=no
          fi
          printf '%s\n' "$full" > VERSION
          { echo "full=$full"; echo "release=$rel"; } >> "$GITHUB_OUTPUT"
          echo "version=$full publish=$rel"

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      - name: Upstream's release (dmg and debug tbz, verified) and its dmg payload
        run: |
          set -eu
          up="$(tr -d '[:space:]' < UPSTREAM_VERSION)"
          sh build/fetch-upstream.sh "$up" "$MAVERICKS_BUILD_ROOT/up"
          sh build/extract-dmg.sh "$MAVERICKS_BUILD_ROOT/up/macfuse-$up.dmg" "$MACFUSE_DMG_ROOT"

      - name: Upstream's pinned sources
        run: sh build/fetch-sources.sh "$MAVERICKS_BUILD_ROOT/src"

      - name: MFMount, libfuse 2 and 3, macFUSE.framework, the osrelease shim and the adapted helpers
        run: |
          set -eu
          b="$MAVERICKS_BUILD_ROOT"
          sh build/build-mfmount.sh "$b/src" "$b/stage"
          sh build/build-libfuse.sh "$b/src" "$b/stage" "$b/examples"
          sh build/build-framework.sh "$b/src" "$b/stage" "$b/examples"
          sh build/build-shim.sh "$b/stage"
          sh build/adapt-helpers.sh "$MACFUSE_DMG_ROOT" "$b/stage"

      # spec: build/retarget-kext.sh -- it reads the kernel back-fill from the pinned Recaulk's payload root
      #       (Library/Extensions/<name>.kext), which shipyard's fetch_product_pkg.sh does not extract (it gives the
      #       usr/local/mavergreen/recaulk tree), so the Recaulk component's whole payload is unpacked here
      - name: The pinned Recaulk's payload root, and upstream's kext retargeted for 10.9
        run: |
          set -eu
          b="$MAVERICKS_BUILD_ROOT"
          rc="$(tr -d '[:space:]' < components/recaulk/version)"
          id="$(sh "$SHIPYARD_SCRIPTS/product-name.sh" identifier recaulk)"
          pkg="$(sh "$SHIPYARD_SCRIPTS/fetch-release-pkg.sh" recaulk "$rc" "recaulk-$rc.pkg" "$b/recaulk-pkg")"
          stevedore="$(sh "$SHIPYARD_SCRIPTS/fetch_stevedore.sh")"
          rm -rf "$b/recaulk-pkg/expanded" "$b/recaulk-root"
          "$stevedore" expand "$pkg" "$b/recaulk-pkg/expanded" > /dev/null
          info="$(grep -l "identifier=\"$id\"" "$b"/recaulk-pkg/expanded/*/PackageInfo)"
          [ "$(printf '%s\n' "$info" | grep -c .)" -eq 1 ] || { echo "::error::recaulk-$rc.pkg does not hold exactly one $id component"; exit 1; }
          payload="$(dirname "$info")/Payload"
          mkdir "$b/recaulk-root"
          gzip -dc < "$payload" > "$b/recaulk-pkg/payload.cpio"
          (cd "$b/recaulk-root" && cpio -id --quiet < "$b/recaulk-pkg/payload.cpio")
          set -- "$b"/recaulk-root/Library/Extensions/*.kext
          [ -d "$1" ] || { echo "::error::Recaulk $rc's pkg ships no Library/Extensions kext, which macfuse.kext links"; exit 1; }
          sh build/retarget-kext.sh "$MACFUSE_DEBUG_TBZ" "$b/recaulk-root" "$b/kext-out"

      # spec: 2026-11-18-macfuse-design.md "Proof" -- the compat guard, OBJC_STRICT on, over every shipped Mach-O we build or
      #       adapt; tests/lib/strict-measure.sh excuses only the Drydock gaps INGREDIENTS.md declares, by exact finding and count
      - name: Compat guard (strict) on every shipped binary
        run: |
          set -eu
          . build/lib.sh
          . tests/lib/strict-measure.sh
          p="$MAVERICKS_BUILD_ROOT/stage$MACFUSE_PREFIX"
          rc=0
          for b in fs/Contents/Frameworks/MFMount.framework/Versions/A/MFMount lib/libfuse.2.dylib lib/libfuse3.4.dylib \
                   Frameworks/macFUSE.framework/Versions/A/macFUSE lib/libmfosrelease.dylib \
                   fs/Contents/Resources/mount_macfuse fs/Contents/Resources/load_macfuse; do
            strict_measure "$p/$b" "$RUNNER_TEMP/strict-$(basename "$b").log" || rc=1
          done
          exit "$rc"

      - name: Stage the product, build the updater, package
        env:
          VER: ${{ steps.ver.outputs.full }}
        run: |
          set -eu
          b="$MAVERICKS_BUILD_ROOT"
          sh build/stage.sh "$b/stage" "$MACFUSE_DMG_ROOT" "$b/kext-out/macfuse.kext" "$b/product"
          mkdir -p "$b/updater"
          sh build/build-updater.sh "$MACFUSE_DMG_ROOT" "$VER" "$b/updater/macfuse-updater.app"
          sh build/package.sh --stage "$b/product" --updater-app "$b/updater/macfuse-updater.app" --version "$VER" --out "$DIST"

      - name: Run the repo's tests
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh"

      - name: Ingredient pins are well declared
        run: sh "$SHIPYARD_SCRIPTS/check-ingredient-pins.sh"

      - name: Release notes
        env:
          VER: ${{ steps.ver.outputs.full }}
        run: |
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" --tag "$VER" --version "$VER" \
            --product macFUSE --min-os 10.9.5 --out "$DIST/RELEASE_NOTES.md"

      - name: Record the declared state in the notes
        run: |
          set -eu
          digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
          sh "$SHIPYARD_SCRIPTS/release-state-record.sh" --notes-file "$DIST/RELEASE_NOTES.md" --digest "$digest"

      - name: clang22's Mach-O readers, for the steps that read the pkg
        run: |
          set -eu
          CL="$(sh "$SHIPYARD_SCRIPTS/fetch_clang22.sh" components/clang22)"
          { echo "LIPO=$CL/bin/llvm-lipo"; echo "OTOOL=$CL/bin/llvm-otool"; echo "NM=$CL/bin/llvm-nm"; } >> "$GITHUB_ENV"

      - name: Sign the pkg and write its feed
        if: steps.ver.outputs.release == 'yes'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.full }}
        run: |
          set -eu
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY is not visible to this repo"; exit 1; }
          sh "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" --product macfuse --feed-dir "$DIST" \
            --channel-title "macFUSE for Mavericks" --version "$VER" \
            --pkg-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/$VER/macfuse-$VER.pkg" \
            --notes-file "$DIST/RELEASE_NOTES.md" --pkg "$DIST/macfuse-$VER.pkg" --min-os 10.9.5

      - name: Unsigned stand-in feed (never published)
        if: steps.ver.outputs.release != 'yes'
        run: sh "$SHIPYARD_SCRIPTS/stand-in-feeds.sh" "$DIST" "${{ steps.ver.outputs.full }}"

      - name: Artifact conformance
        run: |
          set -eu
          facts="$(sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" "$DIST" "${{ steps.ver.outputs.full }}")"
          printf '%s\n' "$facts" | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"

      - name: The feed is an upgrade
        if: steps.ver.outputs.release == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh "$SHIPYARD_SCRIPTS/assert_appcast_upgradeable.sh" --appcast "$DIST/macfuse.xml" --version "${{ steps.ver.outputs.full }}"

      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: macfuse
          if-no-files-found: error
          path: |
            ${{ env.DIST }}/*.pkg
            ${{ env.DIST }}/RELEASE_NOTES.md
            ${{ env.DIST }}/*.xml

      - uses: actions/upload-artifact@v7
        with:
          name: macfuse-examples
          if-no-files-found: error
          path: ${{ env.MAVERICKS_BUILD_ROOT }}/examples/*

  on-mavericks:
    needs: [build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || startsWith(github.head_ref, 'renovate/')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/on-mavericks.yml
    with:
      version: ${{ needs.build.outputs.version }}
      artifact: macfuse
      examples: macfuse-examples
    secrets:
      MAVERICKS_VM_KEY: ${{ secrets.MAVERICKS_VM_KEY }}

  scan:
    needs: [build]
    if: always() && needs.build.outputs.publish == 'yes'
    permissions: { actions: read, contents: read }
    uses: Mavergreen/shipyard/.github/workflows/scan-for-key.yml@v1
    with: { artifact: macfuse }
    secrets: { SPARKLE_PRIVATE_KEY: "${{ secrets.SPARKLE_PRIVATE_KEY }}" }

  publish:
    needs: [build, on-mavericks, scan]
    if: needs.build.outputs.publish == 'yes'
    permissions: { contents: write }
    uses: Mavergreen/shipyard/.github/workflows/publish-release.yml@v1
    with: { version: "${{ needs.build.outputs.version }}", artifact: macfuse }

  retry:
    needs: [build, publish]
    if: always() && needs.publish.result == 'failure'
    permissions: { contents: read, actions: write }
    uses: Mavergreen/shipyard/.github/workflows/retry-release.yml@v1
    with: { version: "${{ needs.build.outputs.version }}" }

  required:
    name: required (release)
    if: always()
    needs: [build, on-mavericks, scan, publish, retry]
    runs-on: ubuntu-latest
    steps:
      - uses: Mavergreen/shipyard/.github/actions/required-gate@v1
        with:
          needs: ${{ toJSON(needs) }}
