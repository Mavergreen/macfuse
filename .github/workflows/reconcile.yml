name: reconcile

on:
  schedule:
    - cron: "53 6 * * *"
  workflow_dispatch:

# spec: mavergreen-conventions SKILL.md "New-project checklist" item 13 -- a called workflow gets no more than its caller
#       grants, so the nightly backstop needs these here
permissions:
  contents: read
  actions: write

jobs:
  reconcile:
    permissions:
      contents: read
      actions: write
    uses: Mavergreen/shipyard/.github/workflows/reconcile.yml@v1
    with:
      dispatch-field: reconcile=true
