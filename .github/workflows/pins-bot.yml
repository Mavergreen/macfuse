name: pins-bot

# spec: scripts/pin-sources.sh -- A macFUSE bump's Renovate PR moves UPSTREAM_VERSION. The builds fetch the four source commits that release pins
#       (components/macfuse-sources/pins), each as GitHub's tarball verified by a SHA-256 that Renovate cannot compute,
#       so until the pins move CI fails at the first fetch. This fills them on Renovate's own branch, in two jobs:
#       - pins (contents: read) runs scripts/pin-sources.sh, which reads the release's gitlinks, downloads the tarballs
#         and checks with git that each holds exactly its commit's tree. Upstream's bytes are read there, never run,
#         and never beside a token that can write. It outputs the eight KEY=VALUE words, or nothing when the pins
#         already hold them.
#       - push touches no upstream byte: it validates the eight words, writes them into the pins file, commits, and
#         pushes to the branch with a token of the Mavergreen pins-bot GitHub App (org variable PINS_BOT_CLIENT_ID,
#         org secret PINS_BOT_PRIVATE_KEY; minted for this repository with contents: write alone). A push made with
#         GITHUB_TOKEN starts no workflow, and a run it dispatches does not count for the PR's required check; the
#         App's push starts release.yml like any push, and that run's `build` job is main's required check on the new
#         head, so a patch bump automerges on green. Hence no dispatch step. The job's own GITHUB_TOKEN reads only.
#       renovate.json's gitIgnoredAuthors keeps this bot's commit from marking the branch as edited by someone else.

on:
  push:
    branches: ['renovate/**']
    paths: [UPSTREAM_VERSION]

permissions: {}

# platform: the run the bot's own push starts gets a group of its own, and its jobs are skipped: that push is the
#           checked pins, and it must not cancel the run that made it.
concurrency:
  group: pins-bot-${{ github.ref }}${{ github.actor == 'mavergreen-pins-bot[bot]' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  pins:
    if: github.actor != 'mavergreen-pins-bot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pins: ${{ steps.pin.outputs.pins }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      - name: The source pins of UPSTREAM_VERSION, if they are stale
        id: pin
        run: |
          set -eu
          sh scripts/pin-sources.sh "$(tr -d '[:space:]' < UPSTREAM_VERSION)" >&2
          if git diff --quiet -- components/macfuse-sources/pins; then pins=""; else pins="$(tr '\n' ' ' < components/macfuse-sources/pins)"; fi
          echo "pins=$pins" >> "$GITHUB_OUTPUT"

  push:
    needs: pins
    if: needs.pins.outputs.pins != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: A pins-bot App token, contents write on this repository alone
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PINS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PINS_BOT_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}

      - name: Commit the pins to the branch, as the App, which starts release.yml on its new head
        env:
          PINS: ${{ needs.pins.outputs.pins }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eu
          : > components/macfuse-sources/pins
          for key in LIBRARY2 LIBRARY3 MOUNT FRAMEWORK; do
            for field in DIGEST SHA256; do
              v=""
              for w in $PINS; do case "$w" in "${key}_${field}="*) v="${w#*=}" ;; esac; done
              case "$v" in *[!0-9a-f]*|'') echo "bad ${key}_${field}: '$v'" >&2; exit 1 ;; esac
              want=64; [ "$field" = DIGEST ] && want=40
              [ "${#v}" -eq "$want" ] || { echo "bad ${key}_${field}: '$v'" >&2; exit 1; }
              printf '%s_%s=%s\n' "$key" "$field" "$v" >> components/macfuse-sources/pins
            done
          done
          git diff --quiet -- components/macfuse-sources/pins && { echo "pins already hold them"; exit 0; }
          git -c user.name='mavergreen-pins-bot[bot]' -c user.email='342268518+mavergreen-pins-bot[bot]@users.noreply.github.com' \
            commit -q -m 'chore(pins): the source pins of the moved UPSTREAM_VERSION' \
            -m 'Written by .github/workflows/pins-bot.yml: its pins job checked, with git, that each tarball is its commit'"'"'s tree.' components/macfuse-sources/pins
          git push origin "HEAD:refs/heads/$BRANCH"
